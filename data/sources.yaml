# Source registry: every external fact in Margwise traces to one of these entries.
# trust: official = read from the issuing body; secondary = reliable aggregator or news; estimate = our own estimate.
# cadence: how often the source should be re-read. stage: the pipeline script that reads it.
sources:
  - id: onet_interests
    name: O*NET OnLine, Interests (RIASEC) by occupation
    publisher: US Department of Labor, Employment and Training Administration
    url: https://www.onetonline.org
    licence: CC BY 4.0
    trust: official
    cadence: yearly (O*NET database release, usually mid-year)
    stage: onet/scrape.py
    feeds: [careers.values]
  - id: onet_wages
    name: O*NET OnLine summary pages (US median wage, projected growth and openings from BLS)
    publisher: US Bureau of Labor Statistics via O*NET
    url: https://www.onetonline.org
    licence: CC BY 4.0
    trust: official
    cadence: yearly (wages in spring, projections in late summer)
    stage: onet/wages.py
    feeds: [careers.us]
  - id: onet_tasks
    name: O*NET task statements
    publisher: US Department of Labor, Employment and Training Administration
    url: https://www.onetonline.org
    licence: CC BY 4.0
    trust: official
    cadence: yearly
    stage: ai_exposure.py
    feeds: [careers.ai.used, careers.ai.human]
  - id: anthropic_job_exposure
    name: Anthropic Economic Index, observed exposure by occupation
    publisher: Anthropic
    url: https://huggingface.co/datasets/Anthropic/EconomicIndex
    licence: CC BY
    trust: official
    cadence: each Economic Index release (roughly quarterly)
    stage: ai_exposure.py
    feeds: [careers.ai.obs, careers.ai.watch]
  - id: anthropic_task_penetration
    name: Anthropic Economic Index, AI use by O*NET task
    publisher: Anthropic
    url: https://huggingface.co/datasets/Anthropic/EconomicIndex
    licence: CC BY
    trust: official
    cadence: each release
    stage: ai_exposure.py
    feeds: [careers.ai.used, careers.ai.human]
  - id: bls_ai_exposure
    name: BLS AI exposure categories (relative exposure of 831 occupations, combining five studies; also 2025-35 projections)
    publisher: US Bureau of Labor Statistics, Employment Projections
    url: https://www.bls.gov/emp/publications/ai-exposure-categories.htm
    licence: US government work (public domain)
    trust: official
    cadence: yearly, with each projections release (the 2026-36 set is due in 2027)
    stage: ai_exposure.py (reads data/ai/bls_ai_exposure.csv; BLS blocks scripted downloads, so the xlsx is saved by hand)
    feeds: [careers.ai.tier, careers.us.growthPct]
    notes: Built from Felten et al., Eloundou et al. 2023, Eisfeldt et al. (theoretical) and Anthropic and Microsoft (observed). Categories are relative bins, not absolute risk.
  - id: plfs
    name: Periodic Labour Force Survey, earnings tables
    publisher: MoSPI, via India Labour Observatory tables
    url: https://www.pib.gov.in/PressReleasePage.aspx?PRID=2246009&lang=1&reg=3
    licence: Government open data; observatory tables CC BY 4.0
    trust: secondary
    cadence: yearly (annual report)
    stage: plfs.py (reads plfs_2025.json)
    feeds: [careers.in, plfs]
  - id: exam_bodies
    name: Exam and admission rules (NTA, NMC, UPSC, ICAI, Bar Council, Council of Architecture, IMU, NCHM and others)
    publisher: the bodies themselves
    url: see content.json fields[].sources
    licence: public information
    trust: official where read from a notice, secondary otherwise (marked per fact)
    cadence: before every admission season and whenever a notice changes
    stage: content.py (curated text), checked through the fact-check batches
    feeds: [fields.exams, fields.subjects, fields.degree, fields.verify]
  - id: nirf
    name: NIRF rankings
    publisher: Ministry of Education
    url: https://www.nirfindia.org
    licence: public information
    trust: official
    cadence: yearly
    stage: extras.py (link only)
    feeds: [fields.compare]
  - id: abroad_official
    name: Study and work abroad costs, visas and salaries (College Board, GOV.UK, canada.ca, DAAD, Nuffic, MOE Singapore, HESA, QILT and others)
    publisher: official education and immigration bodies
    url: see abroad.json countries[].*.src
    licence: public information
    trust: official, secondary or estimate (badge per figure)
    cadence: quarterly for visa and fee rules, yearly for salaries
    stage: abroad.json (curated), checked through the fact-check batches
    feeds: [abroad]
  - id: fx
    name: Exchange rates
    publisher: open.er-api.com
    url: https://open.er-api.com
    licence: free tier terms
    trust: secondary
    cadence: monthly
    stage: manual until automated (abroad.json fx)
    feeds: [abroad.fx]
  - id: onet_database
    name: O*NET database, text format (skills, knowledge, work activities, tasks, software, titles, related occupations, job zones)
    publisher: US Department of Labor, Employment and Training Administration
    url: https://www.onetcenter.org/database.html
    licence: CC BY 4.0
    trust: official
    cadence: yearly (O*NET publishes several database versions a year; the pipeline pins one in data/graph/fetch_onet.py)
    stage: graph/fetch_onet.py
    feeds: [graph.occupations, graph.needs, graph.has_task, graph.close_to, graph.titles]
    notes: Every needs edge keeps O*NET's own rating date. The release date and the pinned version are in data/graph/raw/onet/<version>/SOURCE.md.
  - id: margwise_fields
    name: Margwise field assignments (which of the 16 fields each student career belongs to)
    publisher: Margwise (curated in data/content.json)
    url: see data/content.json (careers[].field, careers[].soc)
    licence: Margwise
    trust: estimate
    cadence: whenever content.json changes
    stage: graph/build_graph.py (reads data/content.json)
    feeds: [graph.clusters, graph.in_cluster]
    notes: Our own grouping, not an official classification. Where content.json holds an old O*NET code, data/graph/raw/soc_aliases.csv maps it to the current one.
  - id: margwise_abbrev_in
    name: Indian job-title and abbreviation starter list (IT, BPM, BFSI)
    publisher: Margwise (drafted by the data lane)
    url: see data/graph/raw/abbrev_in.csv and data/graph/raw/titles_in.csv
    licence: Margwise
    trust: estimate
    cadence: whenever the owner reviews it
    stage: graph/export.py (reads data/graph/raw/abbrev_in.csv and raw/titles_in.csv)
    feeds: [skills_index.alt, titles]
    notes: NEEDS OWNER REVIEW. Not taken from a published list. Each mapping is a plain-language judgement.
